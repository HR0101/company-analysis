name: validate

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    name: プラグイン定義・スキル・スクリプトの検証
    runs-on: ubuntu-latest
    steps:
      - name: リポジトリを取得する
        uses: actions/checkout@v4

      - name: Pythonを準備する
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: プラグイン定義・スキル・同梱スクリプトを検証する
        run: python3 tools/validate.py

      - name: ユニットテストスイートを実行する
        run: python3 tests/test_company_analysis_plugin.py
